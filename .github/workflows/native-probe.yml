name: libcrc32c native Windows ARM64
on:
  push:
    branches: [codex/libcrc32c-arm64-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/libcrc32c-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test libcrc32c
        shell: cmd
        env:
          BUILD_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld
          CONFIG: ${{ matrix.config }}
          MINIFORGE_HOME: C:\Miniforge
          PYTHONUNBUFFERED: '1'
          UPLOAD_PACKAGES: 'False'
          CONDA_CHANNEL_PRIORITY: strict
          EXTRA_CB_OPTIONS: '--override-channels -c conda-forge'
          RATTLER_BUILD_COLOR: always
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call ".scripts\run_win_build.bat"
      - name: Preserve libcrc32c package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libcrc32c-arm64-package
          path: C:\bld\**\*.conda
          if-no-files-found: warn
          retention-days: 7
